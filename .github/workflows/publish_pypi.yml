name: Build and publish release to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build source distribution and Windows wheels
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python -c "import os, tomllib; version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; tag = os.environ['RELEASE_TAG']; assert tag == f'v{version}', f'Release tag {tag!r} must be v{version}'"

      - name: Build source distribution
        run: python -m pip install build; python -m build --sdist --outdir dist

      - name: Build Windows wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_PLATFORM: windows
          CIBW_BUILD: "cp39-win_amd64 cp310-win_amd64 cp311-win_amd64 cp312-win_amd64 cp313-win_amd64 cp314-win_amd64"
          CIBW_SKIP: "pp* *-win32 *-win_arm64"
          CIBW_TEST_COMMAND: >-
            python -c "import rodhypix; assert rodhypix.HAS_NATIVE_CPP, 'Native C++ backend is not available'"

      - name: Verify Windows wheel coverage
        shell: pwsh
        run: |
          $targets = @("cp39", "cp310", "cp311", "cp312", "cp313", "cp314")
          $wheelNames = Get-ChildItem -Path wheelhouse -Filter "*.whl" | Select-Object -ExpandProperty Name
          foreach ($target in $targets) {
            if (-not ($wheelNames | Where-Object { $_ -like "*-$target-$target-win_amd64.whl" })) {
              throw "Missing Windows wheel for $target"
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: windows-wheels
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rodhypix
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: windows-wheels
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
